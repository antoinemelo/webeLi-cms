openapi: "3.1.0"
info:
  title: "DEC CMS Public Headless API"
  version: "1.0.0"
  description: "OpenAPI généré depuis docs/reference/contracts/headless-v1/. Surface limitée à /api/v1/*."
servers:
  -
    url: "/"
    description: "Même origine que le front public."
tags:
  -
    name: "Headless v1"
    description: "API publique headless v1."
paths:
  "/api/v1":
    get:
      operationId: "get_public_discovery_v1"
      summary: "Découvrir l’API headless publique."
      description: "Retourne les URLs stables de santé et des spécifications OpenAPI pour le site courant."
      tags:
        - "Headless v1"
      security: []
      parameters: []
      responses:
        "200":
          description: "Réponse normalisée de l'API publique headless v1."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    required:
                      - "name"
                      - "status"
                      - "base_path"
                      - "health"
                      - "openapi"
                    properties:
                      name:
                        type: "string"
                      status:
                        type: "string"
                        enum:
                          - "available"
                      base_path:
                        type: "string"
                      health:
                        type: "string"
                      openapi:
                        type: "object"
                        required:
                          - "json"
                          - "yaml"
                        properties:
                          json:
                            type: "string"
                          yaml:
                            type: "string"
                  meta:
                    type: "object"
                    required:
                      - "contract"
                      - "request_id"
                    properties:
                      contract:
                        type: "string"
                        const: "public.discovery.v1"
                      request_id:
                        type: "string"
                    additionalProperties: true
              examples:
                default:
                  value:
                    data:
                      name: "DEC CMS Public Headless API"
                      status: "available"
                      base_path: "/mod/api/v1"
                      health: "/mod/api/v1/health"
                      openapi:
                        json: "/mod/api/v1/openapi.json"
                        yaml: "/mod/api/v1/openapi.yaml"
                    meta:
                      contract: "public.discovery.v1"
                      request_id: "20260622120000-abc"
  "/api/v1/catalog/brands":
    get:
      operationId: "get_public_catalog_brands_index_v1"
      summary: "Lister les marques publiques du catalogue."
      description: "Retourne les marques actives, publiques et non archivées du module Business."
      tags:
        - "Headless v1"
      security:
        -
          BearerAuth: []
      parameters:
        -
          name: "lang"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
      responses:
        "200":
          description: "Réponse normalisée de l'API publique headless v1."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    required:
                      - "items"
                    properties:
                      items:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "id"
                            - "name"
                            - "slug"
                          additionalProperties: true
                  meta:
                    "$ref": "#/components/schemas/PublicMeta"
              examples:
                default:
                  value:
                    data:
                      items:
                        -
                          id: 1
                          name: "Acme"
                          slug: "acme"
                    meta:
                      contract: "public.catalog.brands.index.v1"
  "/api/v1/catalog/categories":
    get:
      operationId: "get_public_catalog_categories_index_v1"
      summary: "Lister les catégories publiques du catalogue."
      description: "Retourne les catégories publiques non archivées du module Business."
      tags:
        - "Headless v1"
      security:
        -
          BearerAuth: []
      parameters:
        -
          name: "lang"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
      responses:
        "200":
          description: "Réponse normalisée de l'API publique headless v1."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    required:
                      - "items"
                    properties:
                      items:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "id"
                            - "name"
                            - "slug"
                          additionalProperties: true
                  meta:
                    "$ref": "#/components/schemas/PublicMeta"
              examples:
                default:
                  value:
                    data:
                      items:
                        -
                          id: 1
                          name: "Textile"
                          slug: "textile"
                    meta:
                      contract: "public.catalog.categories.index.v1"
  "/api/v1/catalog/products":
    get:
      operationId: "get_public_catalog_products_index_v1"
      summary: "Lister les produits publics e-commerce."
      description: "Retourne uniquement les produits actifs, publics, e-commerce et non archivés. Le payload public peut inclure main_asset, gallery_assets, public_attributes et is_sellable_public. Les prix d'achat, marges, fournisseurs, notes internes, métadonnées asset internes et stocks exacts ne sont jamais exposés."
      tags:
        - "Headless v1"
      security:
        -
          BearerAuth: []
      parameters:
        -
          name: "lang"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
        -
          name: "q"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
        -
          name: "brand"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
        -
          name: "brand_id"
          in: "query"
          required: false
          description: ""
          schema:
            type: "integer"
        -
          name: "category"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
        -
          name: "category_id"
          in: "query"
          required: false
          description: ""
          schema:
            type: "integer"
        -
          name: "limit"
          in: "query"
          required: false
          description: ""
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 24
        -
          name: "offset"
          in: "query"
          required: false
          description: ""
          schema:
            type: "integer"
            minimum: 0
            default: 0
      responses:
        "200":
          description: "Réponse normalisée de l'API publique headless v1."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    required:
                      - "items"
                      - "pagination"
                    properties:
                      items:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "id"
                            - "name"
                            - "slug"
                            - "variants"
                          additionalProperties: true
                      pagination:
                        "$ref": "#/components/schemas/Pagination"
                  meta:
                    "$ref": "#/components/schemas/PublicMeta"
              examples:
                default:
                  value:
                    data:
                      items:
                        -
                          id: 1
                          name: "T-shirt"
                          slug: "t-shirt"
                          main_asset:
                            asset_id: 20
                            media_id: 101
                            role: "main"
                            url: "/media/101"
                            alt_text: "T-shirt"
                          gallery_assets:
                            -
                              asset_id: 21
                              media_id: 102
                              role: "gallery"
                              url: "/media/102"
                              alt_text: "T-shirt détail"
                          public_attributes:
                            -
                              code: "matiere"
                              name: "Matière"
                              data_type: "text"
                              value: "Coton"
                              language: "fr"
                          is_sellable_public: true
                          variants:
                            -
                              id: 10
                              is_sellable_public: true
                              pricing:
                                regular_sale_price: "38.50"
                                final_sale_price: "36.58"
                                currency: "CHF"
                                discount:
                                  label: "Offre spéciale"
                                  type: "percent"
                                  value: "5.00"
                      pagination:
                        total: 1
                        limit: 24
                        offset: 0
                        has_more: false
                    meta:
                      contract: "public.catalog.products.index.v1"
  "/api/v1/catalog/products/{slug}":
    get:
      operationId: "get_public_catalog_products_show_v1"
      summary: "Lire un produit public e-commerce par slug."
      description: "Retourne un produit actif, public, e-commerce et non archivé avec variantes actives, options, médias publics, attributs PIM publics, verdict is_sellable_public et prix de vente publics. Les métadonnées asset internes, attributs non publics, prix d'achat, marges et stocks exacts ne sont jamais exposés."
      tags:
        - "Headless v1"
      security:
        -
          BearerAuth: []
      parameters:
        -
          name: "lang"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
        -
          name: "slug"
          in: "path"
          required: true
          description: ""
          schema:
            type: "string"
      responses:
        "200":
          description: "Réponse normalisée de l'API publique headless v1."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    required:
                      - "product"
                    properties:
                      product:
                        type: "object"
                        additionalProperties: true
                  meta:
                    "$ref": "#/components/schemas/PublicMeta"
              examples:
                default:
                  value:
                    data:
                      product:
                        id: 1
                        name: "T-shirt"
                        slug: "t-shirt"
                        main_asset:
                          asset_id: 20
                          media_id: 101
                          role: "main"
                          url: "/media/101"
                          alt_text: "T-shirt"
                        gallery_assets: []
                        public_attributes:
                          -
                            code: "matiere"
                            name: "Matière"
                            data_type: "text"
                            value: "Coton"
                        is_sellable_public: true
                        variants: []
                    meta:
                      contract: "public.catalog.products.show.v1"
        "404":
          description: "Produit public introuvable."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicApiError"
              examples:
                default:
                  value:
                    error:
                      code: "NOT_FOUND"
                      message: "Produit public introuvable."
                      details: {}
                    meta:
                      contract: "error.v1"
                      request_id: "20260604120000-abc"
  "/api/v1/catalog/variants/{id}":
    get:
      operationId: "get_public_catalog_variants_show_v1"
      summary: "Lire une variante publique active."
      description: "Retourne une variante active rattachée à un produit actif, public, e-commerce et non archivé avec options, médias publics, attributs PIM publics, verdict is_sellable_public et prix de vente publics. Les prix d'achat, marges, attributs non publics, métadonnées asset internes et stocks exacts ne sont pas exposés."
      tags:
        - "Headless v1"
      security:
        -
          BearerAuth: []
      parameters:
        -
          name: "lang"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
        -
          name: "id"
          in: "path"
          required: true
          description: ""
          schema:
            type: "integer"
            minimum: 1
      responses:
        "200":
          description: "Réponse normalisée de l'API publique headless v1."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    required:
                      - "variant"
                    properties:
                      variant:
                        type: "object"
                        additionalProperties: true
                  meta:
                    "$ref": "#/components/schemas/PublicMeta"
              examples:
                default:
                  value:
                    data:
                      variant:
                        id: 10
                        sku: "TSHIRT-M"
                        main_asset:
                          asset_id: 20
                          media_id: 101
                          role: "main"
                          url: "/media/101"
                          alt_text: "T-shirt M"
                        public_attributes:
                          -
                            code: "couleur"
                            name: "Couleur"
                            data_type: "text"
                            value: "Bleu"
                        is_sellable_public: true
                        pricing:
                          regular_sale_price: "38.50"
                          final_sale_price: "36.58"
                          currency: "CHF"
                          discount: null
                    meta:
                      contract: "public.catalog.variants.show.v1"
        "404":
          description: "Variante publique introuvable."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicApiError"
              examples:
                default:
                  value:
                    error:
                      code: "NOT_FOUND"
                      message: "Variante publique introuvable."
                      details: {}
                    meta:
                      contract: "error.v1"
                      request_id: "20260604120000-abc"
  "/api/v1/content":
    get:
      operationId: "get_public_content_index_v1"
      summary: "Lister des contenus publiés."
      description: "Retourne une liste légère et paginée de contenus publiés, filtrable par type, taxonomie et terme. La variante query `?type=` et la variante path `{type}` conservent le même contrat."
      tags:
        - "Headless v1"
      security:
        -
          BearerAuth: []
      parameters:
        -
          name: "site"
          in: "query"
          required: false
          description: "Site key actif à cibler explicitement. Si absent, résolution par domaine/base path."
          schema:
            type: "string"
        -
          name: "site_id"
          in: "query"
          required: false
          description: "Identifiant technique d'un site actif. Prioritaire sur site si fourni."
          schema:
            type: "integer"
            minimum: 1
        -
          name: "lang"
          in: "query"
          required: false
          description: "Code langue demandé. Si la langue n'est pas active, fallback sur la langue par défaut du site."
          schema:
            type: "string"
            pattern: "^[a-z]{2}(?:-[a-z0-9]{2,8})?$"
        -
          name: "limit"
          in: "query"
          required: false
          description: "Nombre maximum d'éléments retournés."
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 24
        -
          name: "offset"
          in: "query"
          required: false
          description: "Décalage zéro-indexé."
          schema:
            type: "integer"
            minimum: 0
            default: 0
        -
          name: "page"
          in: "query"
          required: false
          description: "Alternative à offset. Si présent, offset=(page-1)*limit."
          schema:
            type: "integer"
            minimum: 1
        -
          name: "type"
          in: "query"
          required: false
          description: "Type de contenu demandé lorsque la route /api/v1/content est utilisée."
          schema:
            type: "string"
        -
          name: "taxonomy"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
        -
          name: "term"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
      responses:
        "200":
          description: "Réponse normalisée de l'API publique headless v1."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicContentIndexResponse"
              examples:
                default:
                  value:
                    data:
                      items:
                        -
                          id: 42
                          key: "mon-article"
                          type: "article"
                          title: "Mon article"
                          summary: "Résumé SEO"
                          path: "/articles/mon-article"
                          url: "/articles/mon-article"
                          published_at: "2026-05-01 10:00:00"
                          updated_at: "2026-05-02 10:00:00"
                          seo:
                            title: "Mon article"
                            description: "Résumé SEO"
                          taxonomies: []
                      pagination:
                        total: 1
                        limit: 10
                        offset: 0
                        has_more: false
                    meta:
                      contract: "public.content.index.v1"
                      request_id: "20260604120000-abc"
                      site_id: 1
                      language_code: "fr"
                      type: "article"
                      source: "public_content_snapshots"
        "404":
          description: "Le type de contenu demandé n’existe pas ou n’est pas actif."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicApiError"
              examples:
                default:
                  value:
                    error:
                      code: "NOT_FOUND"
                      message: "Le type de contenu demandé n’existe pas ou n’est pas actif."
                      details: {}
                    meta:
                      contract: "error.v1"
                      request_id: "20260604120000-abc"
        "422":
          description: "Paramètre de contexte ou de pagination invalide."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicApiError"
              examples:
                default:
                  value:
                    error:
                      code: "VALIDATION_FAILED"
                      message: "Paramètre de contexte ou de pagination invalide."
                      details: {}
                    meta:
                      contract: "error.v1"
                      request_id: "20260604120000-abc"
  "/api/v1/content-by-path":
    get:
      operationId: "get_public_content_by_path_v1"
      summary: "Lire un contenu publié par chemin canonique."
      description: "Alias de compatibilité v1 servi par PublicHeadlessController::contentByPath. Il retourne l’ancien contrat détaillé system/editorial/seo/blocks/media/links/meta pour un chemin publié."
      tags:
        - "Headless v1"
      security:
        -
          BearerAuth: []
      parameters:
        -
          name: "site"
          in: "query"
          required: false
          description: "Site key actif à cibler explicitement. Si absent, résolution par domaine/base path."
          schema:
            type: "string"
        -
          name: "site_id"
          in: "query"
          required: false
          description: "Identifiant technique d'un site actif. Prioritaire sur site si fourni."
          schema:
            type: "integer"
            minimum: 1
        -
          name: "lang"
          in: "query"
          required: false
          description: "Code langue demandé. Si la langue n'est pas active, fallback sur la langue par défaut du site."
          schema:
            type: "string"
            pattern: "^[a-z]{2}(?:-[a-z0-9]{2,8})?$"
        -
          name: "path"
          in: "query"
          required: false
          description: "Chemin canonique public à lire."
          schema:
            type: "string"
            default: "/"
      responses:
        "200":
          description: "Réponse normalisée de l'API publique headless v1."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicContentShowResponse"
              examples:
                default:
                  value:
                    data:
                      system:
                        id: 42
                        site_id: 1
                        content_type: "article"
                        entry_key: "mon-article"
                        language_code: "fr"
                        status: "published"
                        published_at: "2026-05-01 10:00:00"
                        source_revision_id: 7
                      editorial:
                        title: "Mon article"
                        slug: "mon-article"
                        path: "/articles/mon-article"
                        fields: {}
                        published_at: "2026-05-01 10:00:00"
                        published_at_label: "1 mai 2026"
                        author_name: ""
                        display:
                          show_published_date: true
                          show_author: true
                          show_updated_date: false
                          show_type: true
                          include_author_in_schema: true
                          date_format: "medium"
                      seo:
                        meta_title: "Mon article"
                        meta_description: "Résumé"
                        meta_robots: "index,follow"
                        canonical_url: "/articles/mon-article"
                        json_ld: null
                        hreflang_code: "fr"
                      blocks: []
                      media: []
                      links:
                        canonical: "/articles/mon-article"
                        hreflang: []
                      meta:
                        source: "public_content_snapshots"
                        projected_at: "2026-05-01 10:00:00"
                        blueprint: null
                    meta:
                      contract: "public.content.by_path.v1"
                      request_id: "20260604120000-abc"
                      site_id: 1
                      language_code: "fr"
                      path: "/articles/mon-article"
                      source: "public_content_snapshots"
        "404":
          description: "Aucun contenu publié ne correspond au chemin."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicApiError"
              examples:
                default:
                  value:
                    error:
                      code: "NOT_FOUND"
                      message: "Aucun contenu publié ne correspond au chemin."
                      details: {}
                    meta:
                      contract: "error.v1"
                      request_id: "20260604120000-abc"
        "422":
          description: "Contexte site/langue invalide."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicApiError"
              examples:
                default:
                  value:
                    error:
                      code: "VALIDATION_FAILED"
                      message: "Contexte site/langue invalide."
                      details: {}
                    meta:
                      contract: "error.v1"
                      request_id: "20260604120000-abc"
