  "/api/v1/search":
    get:
      operationId: "get_public_search_index_v1"
      summary: "Rechercher dans les contenus publiés."
      description: "Recherche publique sur les documents indexés cohérents avec les snapshots publiés, filtrable par type, taxonomie et terme. Une requête vide retourne une liste vide."
      tags:
        - "Headless v1"
      security:
        -
          BearerAuth: []
      parameters:
        -
          name: "site"
          in: "query"
          required: false
          description: "Site key actif à cibler explicitement. Si absent, résolution par domaine/base path."
          schema:
            type: "string"
        -
          name: "site_id"
          in: "query"
          required: false
          description: "Identifiant technique d'un site actif. Prioritaire sur site si fourni."
          schema:
            type: "integer"
            minimum: 1
        -
          name: "lang"
          in: "query"
          required: false
          description: "Code langue demandé. Si la langue n'est pas active, fallback sur la langue par défaut du site."
          schema:
            type: "string"
            pattern: "^[a-z]{2}(?:-[a-z0-9]{2,8})?$"
        -
          name: "limit"
          in: "query"
          required: false
          description: "Nombre maximum d'éléments retournés."
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 24
        -
          name: "offset"
          in: "query"
          required: false
          description: "Décalage zéro-indexé."
          schema:
            type: "integer"
            minimum: 0
            default: 0
        -
          name: "page"
          in: "query"
          required: false
          description: "Alternative à offset. Si présent, offset=(page-1)*limit."
          schema:
            type: "integer"
            minimum: 1
        -
          name: "q"
          in: "query"
          required: false
          description: "Texte recherché, tronqué à 120 caractères."
          schema:
            type: "string"
        -
          name: "type"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
        -
          name: "taxonomy"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
        -
          name: "term"
          in: "query"
          required: false
          description: ""
          schema:
            type: "string"
      responses:
        "200":
          description: "Réponse normalisée de l'API publique headless v1."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicSearchResponse"
              examples:
                default:
                  value:
                    data:
                      query: "parapente"
                      items:
                        -
                          id: 42
                          type: "article"
                          title: "Vol parapente"
                          summary: "Résumé"
                          path: "/articles/vol-parapente"
                          updated_at: "2026-05-02 10:00:00"
                          seo:
                            title: "Vol parapente"
                            description: "Résumé"
                            robots: "index,follow"
                      pagination:
                        total: 1
                        limit: 10
                        offset: 0
                        has_more: false
                    meta:
                      contract: "public.search.index.v1"
                      request_id: "20260604120000-abc"
                      site_id: 1
                      language_code: "fr"
                      source: "search_documents + public_content_snapshots"
        "422":
          description: "Contexte site/langue ou pagination invalide."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PublicApiError"
              examples:
                default:
                  value:
                    error:
